name: Build, test and publish
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - run: python3 -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Offline responsive chat checks
        run: |
          export CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable)"
          npm test
      - run: ./gradlew assembleDebug assembleDebugAndroidTest lintDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: herdr-pocket-debug
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Build signed distribution
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          POCKET_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          POCKET_VERSION_CODE: ${{ github.run_number }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          test -n "$KEYSTORE_BASE64"
          export POCKET_KEYSTORE="$RUNNER_TEMP/pocket-release.jks"
          trap 'rm -f "$POCKET_KEYSTORE"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$POCKET_KEYSTORE"
          chmod 600 "$POCKET_KEYSTORE"
          export POCKET_VERSION_CODE=$((POCKET_VERSION_CODE + 100))
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            export POCKET_VERSION_NAME="${REF_NAME#v}"
          else
            export POCKET_VERSION_NAME="0.4.0-dev.${GITHUB_RUN_NUMBER}"
          fi
          ./gradlew assembleRelease --no-daemon
          mkdir -p distribution
          cp app/build/outputs/apk/release/app-release.apk distribution/herdr-pocket.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose distribution/herdr-pocket.apk
          (cd distribution && sha256sum herdr-pocket.apk > herdr-pocket.apk.sha256)
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        with:
          name: signed-distribution
          path: distribution/
          if-no-files-found: error
      - name: Start isolated SSH test fixture
        run: bash scripts/ci_ssh_fixture.sh
      - name: Enable emulator KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Offline Android UI smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install app/build/outputs/apk/debug/app-debug.apk
            adb install app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            python3 scripts/smoke_ui.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: offline-ui-screenshots
          path: ui-artifacts/
          if-no-files-found: ignore

  publish:
    needs: android
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: signed-distribution
          path: distribution
      - name: Publish verified APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="$REF_NAME"
            flags=()
            [[ "$tag" == *-* ]] && flags+=(--prerelease)
          else
            tag="preview-${GITHUB_RUN_NUMBER}"
            flags=(--prerelease)
          fi
          cat > notes.md <<EOF
          Automated Android build from commit ${GITHUB_SHA}.

          Download herdr-pocket.apk below. Android 8.0 or newer required.
          Bridge tests, Android lint and offline emulator interaction checks passed.
          This does not certify real phone/SSH connectivity.

          Uses the persistent Herdr Pocket release signing key. If you installed
          v0.1.0-alpha.1 (debug-signed), uninstall it once before installing this build.
          EOF
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" distribution/* --clobber
          else
            gh release create "$tag" distribution/* --target "$GITHUB_SHA" --title "Herdr Pocket $tag" --notes-file notes.md "${flags[@]}"
          fi
